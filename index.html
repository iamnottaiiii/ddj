<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f2ea" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#10110f" />
  <link rel="icon" href="data:," />
  <title>I Made Something Cool</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap');

    :root {
      color-scheme: light dark;
      --paper: #f4f2ea;
      --ink: #151613;
      --muted: #62645d;
      --line: #c8c8bd;
      --panel: #e9e8df;
      --hot: #e94f37;
      --hot-ink: #fffaf2;
      --acid: #d8f04b;
      --shadow: #171813;
      --preview: #f9f8f2;
      --preview-panel: #e7ecdd;
      --preview-text: #1a2119;
      --selection: #d8f04b;
      --selection-ink: #151613;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #10110f;
        --ink: #f1f0e7;
        --muted: #a6a89f;
        --line: #3a3c36;
        --panel: #1a1c18;
        --hot: #ff674f;
        --hot-ink: #17110e;
        --acid: #cce644;
        --shadow: #000;
        --preview: #20231f;
        --preview-panel: #2b3028;
        --preview-text: #f2f4e8;
        --selection: #ff674f;
        --selection-ink: #15110e;
      }
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Manrope", sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    ::selection { background: var(--selection); color: var(--selection-ink); }
    a { color: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }

    .page {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
    }

    .topline {
      min-height: 62px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      border-bottom: 1px solid var(--line);
      font-family: "DM Mono", monospace;
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      text-decoration: none;
    }
    .monogram {
      width: 38px;
      height: 38px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      place-items: center;
      padding: 5px;
      border: 1px solid var(--ink);
      background: var(--acid);
      color: #151613;
      font: 800 10px/1 "Manrope", sans-serif;
      letter-spacing: -.04em;
      transform: rotate(-2deg);
    }
    .brand-name {
      max-width: 110px;
      font: 700 11px/1.05 "Manrope", sans-serif;
      letter-spacing: -.015em;
      text-transform: none;
    }
    .topline a {
      text-decoration: none;
      border-bottom: 1px solid currentColor;
      padding-bottom: 2px;
    }
    .topline a:hover, .topline a:focus-visible { color: var(--hot); }

    .hero {
      padding: clamp(68px, 11vw, 148px) 0 clamp(72px, 10vw, 126px);
      position: relative;
      border-bottom: 1px solid var(--line);
    }
    .hero-copy { max-width: 960px; }
    .build-tag {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 25px;
      font-family: "DM Mono", monospace;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--muted);
    }
    .build-tag::before {
      content: "";
      width: 30px;
      height: 1px;
      background: currentColor;
    }
    h1 {
      max-width: 940px;
      margin: 0;
      font-size: clamp(52px, 9.2vw, 126px);
      line-height: .91;
      letter-spacing: -.075em;
      font-weight: 800;
    }
    h1 .scribble {
      display: inline-block;
      color: var(--hot);
      position: relative;
      white-space: nowrap;
    }
    h1 .scribble::after {
      content: "";
      position: absolute;
      left: .04em;
      right: -.02em;
      height: .08em;
      bottom: -.08em;
      background: var(--hot);
      transform: rotate(-1.2deg);
    }
    .hero-bottom {
      display: grid;
      grid-template-columns: minmax(0, 600px) auto;
      align-items: end;
      justify-content: space-between;
      gap: 36px;
      margin-top: clamp(38px, 6vw, 70px);
    }
    .hero p {
      margin: 0;
      font-size: clamp(17px, 2vw, 22px);
      color: var(--muted);
      max-width: 590px;
    }
    .projects-link {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      min-width: 220px;
      min-height: 58px;
      padding: 0 20px;
      background: var(--hot);
      color: var(--hot-ink);
      border: 1px solid var(--ink);
      box-shadow: 4px 4px 0 var(--shadow);
      text-decoration: none;
      font-weight: 800;
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .projects-link:hover, .projects-link:focus-visible {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--shadow);
    }
    .projects-link svg { width: 20px; height: 20px; flex: none; }

    .work { padding: clamp(70px, 9vw, 118px) 0; }
    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 28px;
    }
    .section-head h2 {
      margin: 0;
      font-size: clamp(28px, 4vw, 46px);
      letter-spacing: -.045em;
      line-height: 1;
    }
    .section-head span {
      font-family: "DM Mono", monospace;
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .09em;
    }

    .builds-empty {
      min-height: 430px;
      border: 1px solid var(--ink);
      box-shadow: 8px 8px 0 var(--shadow);
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(300px, .95fr);
      background: var(--panel);
    }
    .workbench {
      min-width: 0;
      padding: clamp(34px, 6vw, 72px);
      border-right: 1px solid var(--ink);
      display: flex;
      align-items: flex-end;
      background:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px),
        var(--panel);
      background-size: 28px 28px;
    }
    .note-card {
      width: min(100%, 530px);
      padding: clamp(30px, 5vw, 54px);
      background: var(--preview);
      color: var(--preview-text);
      border: 1px solid var(--ink);
      box-shadow: 12px 12px 0 color-mix(in srgb, var(--ink), transparent 10%);
      transform: rotate(-1deg);
    }
    .note-card span {
      font: 500 10px/1 "DM Mono", monospace;
      color: #697363;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .note-card p {
      margin: 22px 0 0;
      font-size: clamp(30px, 4.5vw, 54px);
      line-height: 1.02;
      letter-spacing: -.055em;
      font-weight: 800;
    }
    .builds-copy {
      padding: clamp(36px, 5vw, 62px);
      background: var(--paper);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 54px;
    }
    .builds-copy .count {
      font: 500 11px/1 "DM Mono", monospace;
      color: var(--muted);
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .builds-copy h3 {
      margin: 0 0 18px;
      font-size: clamp(38px, 5.4vw, 67px);
      line-height: .98;
      letter-spacing: -.06em;
    }
    .builds-copy p {
      margin: 0;
      color: var(--muted);
      font-size: 16px;
    }
    .principles {
      border-top: 1px solid var(--line);
      padding: clamp(70px, 9vw, 112px) 0;
    }
    .criteria {
      margin: 38px 0 0;
      padding: 0;
      list-style: none;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-top: 1px solid var(--ink);
      border-bottom: 1px solid var(--ink);
    }
    .criterion {
      padding: 28px 28px 32px 0;
    }
    .criterion + .criterion {
      padding-left: 28px;
      border-left: 1px solid var(--line);
    }
    .criterion b {
      display: block;
      margin-bottom: 8px;
      font-size: 18px;
      letter-spacing: -.02em;
    }
    .criterion span { color: var(--muted); font-size: 14px; }

    .project {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(300px, .8fr);
      min-height: 545px;
      border: 1px solid var(--ink);
      box-shadow: 8px 8px 0 var(--shadow);
      background: var(--panel);
    }
    .project-visual {
      min-width: 0;
      display: grid;
      place-items: center;
      padding: clamp(24px, 5vw, 62px);
      background:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px),
        var(--panel);
      background-size: 28px 28px;
      border-right: 1px solid var(--ink);
      overflow: hidden;
    }
    .browser {
      width: min(100%, 620px);
      background: var(--preview);
      color: var(--preview-text);
      border: 1px solid var(--ink);
      box-shadow: 13px 13px 0 color-mix(in srgb, var(--ink), transparent 10%);
      transform: rotate(-1.2deg);
    }
    .browser-bar {
      height: 38px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 13px;
      border-bottom: 1px solid #292b26;
    }
    .browser-dot { width: 8px; height: 8px; border: 1px solid #292b26; border-radius: 50%; }
    .browser-dot:first-child { background: #e94f37; }
    .browser-dot:nth-child(2) { background: #f3cb45; }
    .browser-dot:nth-child(3) { background: #92be5e; }
    .mini-app { padding: clamp(24px, 5vw, 48px); }
    .mini-kicker {
      margin: 0 0 13px;
      font: 500 9px/1.2 "DM Mono", monospace;
      letter-spacing: .11em;
      text-transform: uppercase;
      color: #697363;
    }
    .mini-title {
      margin: 0;
      max-width: 420px;
      font-size: clamp(28px, 4vw, 47px);
      line-height: .98;
      letter-spacing: -.06em;
      font-weight: 800;
    }
    .mini-controls {
      margin-top: 34px;
      padding: 18px;
      background: var(--preview-panel);
      border: 1px solid #545a50;
    }
    .mini-label { font: 500 9px/1 "DM Mono", monospace; text-transform: uppercase; letter-spacing: .1em; }
    .mini-select {
      margin-top: 9px;
      min-height: 39px;
      padding: 11px 12px;
      background: var(--preview);
      border: 1px solid #777d71;
      font-size: 11px;
    }
    .mini-button {
      display: inline-block;
      margin-top: 12px;
      padding: 11px 14px;
      background: #e94f37;
      color: #fffaf2;
      font-size: 10px;
      font-weight: 700;
    }

    .project-copy {
      padding: clamp(32px, 5vw, 58px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 50px;
      background: var(--paper);
    }
    .project-number {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      font-family: "DM Mono", monospace;
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .project-copy h3 {
      margin: 22px 0 16px;
      font-size: clamp(36px, 5vw, 64px);
      line-height: .98;
      letter-spacing: -.06em;
    }
    .project-copy p { margin: 0; color: var(--muted); font-size: 16px; }
    .project + .builds-empty { margin-top: clamp(38px, 6vw, 64px); }
    .launch {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      width: 100%;
      min-height: 58px;
      padding: 0 20px;
      background: var(--hot);
      color: var(--hot-ink);
      border: 1px solid var(--ink);
      box-shadow: 4px 4px 0 var(--shadow);
      text-decoration: none;
      font-weight: 800;
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .launch:hover, .launch:focus-visible {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--shadow);
    }
    .launch svg { width: 20px; height: 20px; flex: none; }

    .statement {
      border-top: 1px solid var(--line);
      padding: clamp(70px, 10vw, 132px) 0;
      display: grid;
      grid-template-columns: .55fr 1.45fr;
      gap: clamp(34px, 8vw, 100px);
    }
    .statement-label {
      font-family: "DM Mono", monospace;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .statement blockquote {
      margin: 0;
      max-width: 780px;
      font-size: clamp(28px, 4.4vw, 55px);
      line-height: 1.08;
      letter-spacing: -.05em;
      font-weight: 600;
    }
    .statement blockquote em {
      font-style: normal;
      color: var(--hot);
    }

    footer {
      border-top: 1px solid var(--ink);
      padding: 24px 0 max(24px, env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      font: 400 11px/1.4 "DM Mono", monospace;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .08em;
    }
    footer strong { color: var(--ink); font-weight: 500; }

    @media (max-width: 760px) {
      .page { width: min(100% - 28px, 1180px); }
      .topline { min-height: 55px; }
      .hero { padding-top: 64px; }
      h1 { font-size: clamp(49px, 18vw, 78px); }
      .hero-bottom { grid-template-columns: 1fr; }
      .projects-link { width: 100%; }
      .brand-name { display: none; }
      .builds-empty { grid-template-columns: 1fr; box-shadow: 5px 5px 0 var(--shadow); }
      .workbench { min-height: 330px; border-right: 0; border-bottom: 1px solid var(--ink); padding: 34px 22px 42px; }
      .note-card { box-shadow: 8px 8px 0 color-mix(in srgb, var(--ink), transparent 10%); }
      .criteria { grid-template-columns: 1fr; }
      .criterion, .criterion + .criterion { padding: 22px 0; border-left: 0; }
      .criterion + .criterion { border-top: 1px solid var(--line); }
      .project { grid-template-columns: 1fr; box-shadow: 5px 5px 0 var(--shadow); }
      .project-visual { min-height: 390px; border-right: 0; border-bottom: 1px solid var(--ink); padding: 30px 18px 36px; }
      .browser { transform: rotate(-.8deg); box-shadow: 8px 8px 0 color-mix(in srgb, var(--ink), transparent 10%); }
      .mini-app { padding: 28px 22px; }
      .mini-title { font-size: 32px; }
      .project-copy { min-height: 390px; }
      .statement { grid-template-columns: 1fr; }
      footer { align-items: flex-start; flex-direction: column; }
    }

    @media (max-width: 390px) {
      .topline .edition { display: none; }
      .topline { gap: 12px; }
      .topline > a:last-child { font-size: 10px; }
      .section-head { align-items: flex-end; }
      .project-number { flex-direction: column; gap: 4px; }
      .project-visual { min-height: 350px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="topline" aria-label="Site navigation">
      <a class="brand" href="#top" aria-label="I Made Something Cool, back to top">
        <span class="monogram" aria-hidden="true"><span>I</span><span>M</span><span>S</span><span>C</span></span>
        <span class="brand-name">I Made Something Cool</span>
      </a>
      <span class="edition">Useful things, made properly</span>
    </div>

    <main id="top">
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-copy">
          <h1 id="hero-title">Make it useful.<br />Make it <span class="scribble">cool.</span></h1>
        </div>
        <div class="hero-bottom">
          <p>Small digital things built around real habits, real annoyances, and ideas people would actually use.</p>
          <a class="projects-link" href="projects/">
            <span>See the projects</span>
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14M13.5 6.5 19 12l-5.5 5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </a>
        </div>
      </section>

    </main>

    <footer>
      <strong>IMSC</strong>
      <span>One useful idea at a time</span>
    </footer>
  </div>
</body>
</html>
