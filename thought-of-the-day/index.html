<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thought of the Day — I Made Something Cool</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #FBF6E9;
    color: #1c1a17;
    font-family: Georgia, 'Times New Roman', serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 24px 16px 0;
  }
  .wrap { max-width: 620px; margin: 0 auto; width: 100%; flex: 1; display: flex; flex-direction: column; }
  main { flex: 1; width: 100%; }
  header { text-align: center; padding: 36px 0 8px; }
  .kicker {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #8a8578;
    margin-bottom: 14px;
  }
  h1 { font-size: 40px; font-weight: bold; margin-bottom: 10px; }
  .sub { font-size: 17px; color: #4a463c; font-style: italic; }
  .rule { border: none; border-top: 2px solid #1c1a17; margin: 26px 0; }
  .gate {
    border: 2px solid #1c1a17;
    background: #fffdf6;
    padding: 26px 22px;
    box-shadow: 5px 5px 0 #1c1a17;
  }
  textarea {
    width: 100%;
    min-height: 110px;
    border: 2px solid #1c1a17;
    background: #fff;
    font-family: Georgia, serif;
    font-size: 18px;
    padding: 12px;
    resize: vertical;
    color: #1c1a17;
  }
  textarea:focus { outline: 3px solid #E07840; outline-offset: 1px; }
  .row { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
  .count { font-family: Arial, sans-serif; font-size: 13px; color: #8a8578; }
  button {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 15px;
    font-weight: bold;
    background: #E07840;
    color: #fff;
    border: 2px solid #1c1a17;
    padding: 10px 26px;
    cursor: pointer;
    box-shadow: 3px 3px 0 #1c1a17;
  }
  button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #1c1a17; }
  button:disabled { opacity: 0.55; cursor: default; }
  .err {
    margin-top: 14px;
    border: 2px solid #a33c2a;
    background: #fbeee9;
    color: #a33c2a;
    font-family: Arial, sans-serif;
    font-size: 14px;
    padding: 10px 12px;
  }
  .hidden { display: none !important; }
  #stream h2 { font-size: 24px; margin: 6px 0 18px; text-align: center; }
  .tcard {
    border: 2px solid #1c1a17;
    background: #fffdf6;
    padding: 18px;
    margin-bottom: 16px;
    box-shadow: 4px 4px 0 #1c1a17;
  }
  .tcard p { font-size: 18px; line-height: 1.55; }
  .tcard .ttime {
    margin-top: 10px;
    font-family: Arial, sans-serif;
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #8a8578;
  }
  .empty {
    text-align: center;
    color: #8a8578;
    font-style: italic;
    padding: 40px 0;
    font-size: 17px;
  }
  footer { text-align: center; margin-top: auto; padding: 48px 0 36px; }
  footer a {
    font-family: Arial, sans-serif;
    font-size: 14px;
    color: #1c1a17;
    text-decoration: underline;
  }
</style>
</head>
<body>
<div class="wrap">
  <main>
  <header>
    <div class="kicker">I Made Something Cool</div>
    <h1>Thought of the Day</h1>
    <p class="sub">What's your thought of the day?</p>
  </header>
  <hr class="rule">

  <div id="gate" class="gate">
    <textarea id="box" maxlength="200" placeholder="Type today's thought..."></textarea>
    <div class="row">
      <span id="n" class="count">0 / 200</span>
      <button id="drop">Drop it</button>
    </div>
    <div id="err" class="err hidden"></div>
  </div>

  <div id="stream" class="hidden">
    <h2>Today's thoughts</h2>
    <div id="list"></div>
  </div>

  <div id="bootfail" class="err hidden">This page couldn't start. Check your connection and refresh.</div>
  </main>

  <footer>
    <a href="/projects/">Back to the project shelf</a>
  </footer>
</div>

<script>
setTimeout(function () {
  if (!window.__totd_alive) document.getElementById('bootfail').classList.remove('hidden');
}, 6000);
</script>
<script type="module">
import { generateSecretKey, getPublicKey, finalizeEvent, Relay } from 'https://cdn.jsdelivr.net/npm/nostr-tools@2.25.2/+esm';
window.__totd_alive = true;

const RELAYS = [
  'wss://relay.damus.io',
  'wss://nos.lol',
  'wss://nostrue.com',
  'wss://relay.primal.net'
];
const TAG = 'imsc-thought-of-the-day';
const $ = id => document.getElementById(id);

const dayStr = () => {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
};
const startOfToday = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return Math.floor(d.getTime() / 1000); };

const BANNED = ['fuck','shit','bitch','cunt','nigger','nigga','faggot','retard','whore','slut','porn','xxx'];

let conns = [];
let keyBytes = null;
let postedToday = false;
try { postedToday = localStorage.getItem('totd_day') === dayStr(); } catch (e) {}

function getKey() {
  let hex = null;
  try { hex = localStorage.getItem('totd_sk'); } catch (e) {}
  if (!hex) {
    const sk = generateSecretKey();
    hex = Array.from(sk).map(b => b.toString(16).padStart(2, '0')).join('');
    try { localStorage.setItem('totd_sk', hex); } catch (e) {}
  }
  return new Uint8Array(hex.match(/../g).map(h => parseInt(h, 16)));
}

async function tryConnect() {
  const attempts = RELAYS.map(url =>
    Promise.race([
      Relay.connect(url, { timeout: 9000 }).then(r => ({ url, relay: r })).catch(() => null),
      new Promise(res => setTimeout(() => res(null), 10000))
    ])
  );
  const results = await Promise.allSettled(attempts);
  return results.map(r => r.status === 'fulfilled' ? r.value : null).filter(Boolean);
}

function queryOnce(relay, filter, ms) {
  return new Promise(resolve => {
    const found = [];
    let done = false;
    let sub = null;
    const finish = () => {
      if (done) return;
      done = true;
      clearTimeout(timer);
      try { if (sub) sub.close(); } catch (e) {}
      resolve(found);
    };
    const timer = setTimeout(finish, ms);
    try {
      sub = relay.subscribe([filter], {
        onevent: (e) => { found.push(e); },
        oneose: () => finish()
      });
    } catch (e) { finish(); }
  });
}

async function alreadyPostedToday(pubHex) {
  if (!conns.length) return false;
  const filter = { kinds: [1], authors: [pubHex], '#t': [TAG], since: startOfToday(), limit: 5 };
  const results = await Promise.allSettled(conns.map(({ relay }) => queryOnce(relay, filter, 7000)));
  return results.some(r => r.status === 'fulfilled' && r.value.length > 0);
}

function paintList(events) {
  const list = $('list');
  if (!events.length) {
    list.innerHTML = '<div class="empty">No thoughts yet today. Yours could be the first.</div>';
    return;
  }
  const sorted = [...events].sort((a, b) => b.created_at - a.created_at);
  list.innerHTML = '';
  sorted.forEach(e => {
    const card = document.createElement('div');
    card.className = 'tcard';
    const p = document.createElement('p');
    p.textContent = e.content;
    const t = document.createElement('div');
    t.className = 'ttime';
    t.textContent = new Date(e.created_at * 1000).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    card.appendChild(p);
    card.appendChild(t);
    list.appendChild(card);
  });
}

function showStream() {
  $('gate').classList.add('hidden');
  $('stream').classList.remove('hidden');
  const seen = new Set();
  const events = [];
  if (!conns.length) {
    $('list').innerHTML = '<div class="empty">Could not reach the thought stream. Check your connection and refresh.</div>';
    return;
  }
  $('list').innerHTML = '<div class="empty">Listening for today\u2019s thoughts\u2026</div>';
  conns.forEach(({ relay }) => {
    try {
      relay.subscribe(
        [{ kinds: [1], '#t': [TAG], since: startOfToday(), limit: 200 }],
        { onevent: (e) => {
            if (seen.has(e.id)) return;
            seen.add(e.id);
            events.push(e);
            paintList(events);
          } }
      );
    } catch (e) {}
  });
}

async function onDrop() {
  const box = $('box'), err = $('err'), btn = $('drop');
  err.classList.add('hidden');
  const text = box.value.trim();
  if (!text) { err.textContent = 'Write something first.'; err.classList.remove('hidden'); return; }
  if (BANNED.some(w => text.toLowerCase().includes(w))) { err.textContent = 'Keep it clean.'; err.classList.remove('hidden'); return; }
  btn.disabled = true;
  btn.textContent = 'Dropping\u2026';
  if (!conns.length) {
    conns = await tryConnect();
  }
  if (!conns.length) {
    err.textContent = 'Could not reach the thought stream. Check your connection and try again.';
    err.classList.remove('hidden');
    btn.disabled = false;
    btn.textContent = 'Drop it';
    return;
  }
  const ev = finalizeEvent(
    { kind: 1, created_at: Math.floor(Date.now() / 1000), tags: [['t', TAG]], content: text.slice(0, 200) },
    keyBytes
  );
  await Promise.allSettled(conns.map(({ relay }) =>
    Promise.race([relay.publish(ev).catch(() => null), new Promise(res => setTimeout(res, 8000))])
  ));
  try { localStorage.setItem('totd_day', dayStr()); } catch (e) {}
  postedToday = true;
  btn.disabled = false;
  btn.textContent = 'Drop it';
  showStream();
}

// ---- boot: the form shows immediately, nothing waits on the network
const box = $('box');
box.addEventListener('input', () => { $('n').textContent = box.value.length + ' / 200'; });
try {
  keyBytes = getKey();
} catch (e) {
  const err = $('err');
  err.textContent = 'Could not start. Try a modern browser.';
  err.classList.remove('hidden');
}
$('drop').addEventListener('click', onDrop);
if (postedToday) showStream();

// ---- background: connect, then settle anything the fast path couldn't
(async () => {
  conns = await tryConnect();
  if (!postedToday && conns.length && keyBytes) {
    let pubHex = null;
    try { pubHex = getPublicKey(keyBytes); } catch (e) {}
    if (pubHex && await alreadyPostedToday(pubHex)) postedToday = true;
  }
  if (postedToday) showStream();
})();
</script>
</body>
</html>
